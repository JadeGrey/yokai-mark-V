[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yokai"
version = "0.1.0"
description = "Private single-server Discord bot for music and quality of life."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py[voice]>=2.7.1",
    "davey",
    "yt-dlp[default]",
    "ytmusicapi",
    "httpx",
    "aiosqlite",
    "python-dotenv",
    "spotifyscraper==3.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit external networks (skipped by default)",
]
addopts = "-m \"not live\""
