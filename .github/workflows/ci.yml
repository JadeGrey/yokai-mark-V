name: CI

# Runs lint and the full test suite on Linux, the platform the bot will be hosted on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest -q

  # To also prove it on 64-bit ARM (the Raspberry Pi), add a copy of the job above with
  # `runs-on: ubuntu-24.04-arm`. GitHub only offers those runners free on public repositories.
