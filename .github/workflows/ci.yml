name: CI

# Runs lint and the full test suite on Linux, the platform the bot will be hosted on: x86-64
# (a mini PC or VPS) and 64-bit ARM (a Raspberry Pi). The ARM runners are free for public repos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.arch }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86-64, python-version: "3.12" }
          - { os: ubuntu-latest, arch: x86-64, python-version: "3.13" }
          - { os: ubuntu-24.04-arm, arch: arm64, python-version: "3.12" }
          - { os: ubuntu-24.04-arm, arch: arm64, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Show the platform
        run: python -c "import platform, sys; print(platform.machine(), sys.version)"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Voice encryption library loads
        run: python -c "import davey; print('davey', davey.__name__)"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
