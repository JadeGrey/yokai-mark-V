# The mission pool. Each day the guild board draws a few missions per rank from this pool.
# `stages` run in order; HP carries over between stages. `level` is the enemy level for the
# stage. `attempt_cost` is the daily attempts it uses. Rewards are formulas (see balance.toml
# and ranks.toml), not per-mission numbers. `power` is a percent on top of the rank's enemy
# power that evens out difficulty between missions (calibrated by simulation; 100 is the rank's
# typical mission). Ids are permanent.

