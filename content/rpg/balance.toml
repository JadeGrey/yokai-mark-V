# Tunable numbers for combat, progression and rewards. Placeholders tuned by the pacing
# simulator. Operational settings (daily attempts, turn timer) are environment variables.

[combat]
# Damage multiplier is defense_k / (defense_k + defense). Higher means defense matters less.
defense_k = 40
crit_multiplier_percent = 150
crit_cap = 75
variance_percent = 10
# Damage taken while defending, as a percent of normal.
defend_percent = 50
# Living players recover this percent of max HP between stages.
stage_recovery_percent = 10
# A fight that lasts longer than this many rounds is lost.
max_rounds = 40

[xp]
# XP to go from level L to L+1 is round(base * L ^ exponent).
base = 30
exponent = 1.5

[rewards]
renown_per_level = 2
# Missions below the player's rank pay step ^ ranks_below of the reward, never less than floor.
below_rank_step = 0.6
below_rank_floor = 0.1

[party]
# Index 0 is a party of one, index 3 a party of four. Enemy damage does not grow with the
# party, so each extra member adds escorts (copies of the stage's weakest non-boss foe) as well
# as HP, but only to a stage that already has a group. Tuned with the raids in missions.toml:
# a party of three wins a raid about 70% of the time, a pair a little less often and four a
# little less than three. Ordinary missions are slightly safer in a party than alone.
hp_percent = [100, 120, 230, 255]
extra_foes = [0, 1, 1, 2]

[streak]
# +1 attempt per this many consecutive active days, up to bonus_cap extra attempts.
days_per_bonus = 3
bonus_cap = 3
# A fully missed day removes this many days from the streak (never below 0).
drop_per_missed_day = 3

[gear]
# Selling an unequipped item pays this percent of its price.
sell_percent = 30
# A full repair (0% to 100%) costs this percent of the item's price, pro rata.
repair_percent = 35
# Durability points every equipped item loses when a fight ends.
win_wear = 3
loss_wear = 8
# Items a member can hold. A drop into a full inventory is sold automatically.
inventory_cap = 60
# Each stat of a new item varies by up to this percent around the base value.
roll_percent = 10

[loot]
drop_chance_percent = 35
boss_drop_chance_percent = 100
# Drops come from items whose level requirement is within this many levels below the mission's top level.
tier_window = 15
rarity_weights = { common = 60, uncommon = 28, rare = 10, epic = 2 }
boss_rarity_weights = { common = 15, uncommon = 35, rare = 38, epic = 12 }

[shop]
# Common and uncommon items offered per gear tier each day.
stock_per_tier = 3
