# Guild ranks in ascending order. `min_level` is the level at which promotion into that rank
# opens (the first rank starts at level 1). `xp_share` is the fraction of one level that a
# single attempt's worth of mission pays at that mission rank. All numbers are placeholders
# tuned by the pacing simulator (tests/test_rpg_pacing.py, scripts/rpg_sim.py).
