# Enemy archetypes. Stats are the stats of the stage's level multiplied by `mult` (percent), so
# 100 is a player-equivalent. `actions` is a weighted list; `do` is "attack", "magic" or a skill id.
# `target` is how the enemy picks a player: random | lowest_hp. Bosses are never duplicated by
# party scaling. Ids are permanent: retire an enemy by removing it from missions, never by
# deleting it.

[[enemy]]
id = "gaki"
name = "Gaki"
mult = { hp = 70, attack = 85, magic = 50, defense = 70, resist = 70, speed = 85, crit = 80 }
actions = [{ do = "attack", weight = 1 }]

