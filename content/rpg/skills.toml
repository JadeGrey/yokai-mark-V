# Combat skills. kind: damage | heal | buff | debuff | dot | cleanse.
# target: foe | all_foes | ally | all_allies | self (foe means the opposing side).
# power is a percent of the scaling stat; cooldown is in rounds; buff/debuff change one stat by
# `percent` for `duration` rounds; dot deals its damage every round for `duration` rounds.
# Phase 2 ships enemy skills only; player skills arrive with gear tags.

[[skill]]
id = "rend"
name = "Rend"
kind = "dot"
target = "foe"
scaling = "attack"
power = 40
duration = 3
cooldown = 3

