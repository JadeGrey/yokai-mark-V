# Gear tags, themed on Japanese folklore.
#   leans      the stats a tag's gear favours (up to three, most important first).
#   drawback   the stat this tag's gear costs a little of (the nerf side of its trade-off).
#   bonus_2    set bonus for wearing 2 working pieces; bonus_4 for 4. Values are percentages of
#              the final stat, except crit, which is flat points.
#   skill      the skill wearing 4 working pieces grants.
# Broken gear (0% durability) counts for nothing. Item stats are generated from leans and
# drawback by scripts/gen_rpg_items.py.

[[tag]]
id = "oni"
name = "Oni"
role = "Bruiser"
leans = ["attack", "hp"]
drawback = "speed"
description = "Ogres of folklore. They hit hard and shrug off hits."
bonus_2 = { attack = 8 }
bonus_4 = { attack = 12, hp = 10 }
skill = "rampage"

